<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Notes v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #F5F7F8; font-family: sans-serif; }
        .note-card { transition: transform 0.2s; }
        .note-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-slate-800">Мои заметки</h1>
            <div class="text-xs text-slate-400 uppercase tracking-widest">Local Storage App</div>
        </header>

        <div class="bg-white p-6 rounded-3xl shadow-sm mb-10 border border-slate-100">
            <textarea id="noteInput" class="w-full h-32 p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-indigo-100 outline-none resize-none text-slate-700" placeholder="Напишите что-нибудь важное..."></textarea>
            <button onclick="addNote()" class="mt-4 w-full bg-slate-900 text-white py-4 rounded-2xl font-semibold hover:bg-slate-800 active:scale-[0.98] transition-all shadow-lg shadow-slate-200">
                Сохранить заметку
            </button>
        </div>

        <div id="notesContainer" class="grid gap-4">
            </div>
    </div>

    <script>
    const { jsPDF } = window.jspdf;
    let notes = JSON.parse(localStorage.getItem('my_notes')) || [];

    // Базовая настройка шрифта Roboto (Regular) для поддержки кириллицы
    // Это минифицированная версия шрифта в Base64
    const robotoBase64 = "AAEAAAARAQAABAAQR0RFRgBAACQAAAEsAAAAKkdQT1N6S3YyAAABVAAAAMp0Ym94Pv6m3m8AAAG0AAAAhGdhc3AAAf//AAABJAAAAAxnbHlmNoS7pQAAAcgAABNoaGVhZBgK00MAAADcAAAANmhoZWEH8APhAAABHAAAACRobXR4FvgAAAAAAWAAAAAwbG9jYRJyD1IAAAHAAAAAGm1heHAAEQBcAAABPAAAACBuYW1lEc968wAAEUQAAAHNcG9zdP+XADIAAAFEAAAAIHByZXABy877AAABRAAAAFUAAQAAAAoAHgAsAAFERkxUAAgABAAAAAD//wAAAAAAAAABAAAAlgAAAAAAAAAFAAEAAgAHAAoAAQAAAAA="; 
    // Примечание: В реальном проекте здесь должна быть полная строка шрифта.
    // Для этого примера я использую метод через стандартный Canvas для рендеринга текста, 
    // так как это самый надежный способ без загрузки огромных файлов шрифтов.

    function renderNotes() {
        const container = document.getElementById('notesContainer');
        container.innerHTML = '';
        notes.forEach((note, index) => {
            const div = document.createElement('div');
            div.className = "note-card bg-white p-6 rounded-3xl border border-slate-100 shadow-sm mb-4";
            div.innerHTML = `
                <p class="text-slate-700 whitespace-pre-wrap mb-6 leading-relaxed">${note}</p>
                <div class="flex justify-end gap-3 border-t border-slate-50 pt-4 text-sm font-semibold">
                    <button onclick="exportSingleToPDF(${index})" class="flex items-center gap-2 text-indigo-600 bg-indigo-50 px-4 py-2 rounded-xl hover:bg-indigo-100 transition-colors">
                        PDF
                    </button>
                    <button onclick="deleteNote(${index})" class="text-rose-400 px-4 py-2">Удалить</button>
                </div>`;
            container.appendChild(div);
        });
    }

    async function exportSingleToPDF(index) {
        const noteText = notes[index];
        
        // Используем более современный и простой способ — библиотеку html2canvas
        // Она превращает HTML-блок в картинку, которую PDF понимает без проблем со шрифтами
        const container = document.getElementById('notesContainer');
        const element = container.children[index];
        
        // Временно скрываем кнопки управления перед "снимком"
        const actions = element.querySelector('div');
        actions.style.display = 'none';

        try {
            const canvas = await html2canvas(element, {
                backgroundColor: "#ffffff",
                scale: 2 // Для четкости текста
            });
            
            const imgData = canvas.toDataURL('image/png');
            const doc = new jsPDF('p', 'mm', 'a4');
            
            const imgProps = doc.getImageProperties(imgData);
            const pdfWidth = doc.internal.pageSize.getWidth() - 40;
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            doc.addImage(imgData, 'PNG', 20, 20, pdfWidth, pdfHeight);
            doc.save(`заметка-${index + 1}.pdf`);
        } catch (e) {
            console.error("Ошибка при создании PDF:", e);
        } finally {
            actions.style.display = 'flex'; // Возвращаем кнопки на место
        }
    }

    function addNote() {
        const input = document.getElementById('noteInput');
        if (!input.value.trim()) return;
        notes.unshift(input.value);
        localStorage.setItem('my_notes', JSON.stringify(notes));
        input.value = '';
        renderNotes();
    }

    function deleteNote(index) {
        notes.splice(index, 1);
        localStorage.setItem('my_notes', JSON.stringify(notes));
        renderNotes();
    }

    renderNotes();
</script>
</body>
</html>
