<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Notes - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background-color: #F5F7F8; font-family: ui-sans-serif, system-ui; }
        .note-card { transition: all 0.3s ease; }
        .note-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05); }
    </style>
</head>
<body class="p-6 md:p-12 text-slate-900">

    <div class="max-w-2xl mx-auto">
        <header class="mb-10 flex justify-between items-center">
            <h1 class="text-3xl font-black tracking-tight text-slate-800">ЗАМЕТКИ</h1>
            <div id="statusIndicator" class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">
                <span class="w-2 h-2 rounded-full bg-amber-400" id="dot"></span>
                <span id="statusText">Загрузка шрифтов...</span>
            </div>
        </header>

        <div class="bg-white p-2 rounded-[2.5rem] shadow-xl shadow-slate-200/50 mb-12 border border-white">
            <textarea id="noteInput" class="w-full h-40 p-6 bg-transparent border-none focus:ring-0 outline-none resize-none text-lg text-slate-700" placeholder="Напишите что-нибудь по-русски..."></textarea>
            <div class="p-2 pt-0">
                <button onclick="addNote()" class="w-full bg-slate-900 text-white py-4 rounded-[1.5rem] font-bold hover:bg-slate-800 active:scale-[0.98] transition-all">
                    Сохранить
                </button>
            </div>
        </div>

        <div id="notesContainer" class="grid gap-6"></div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let notes = JSON.parse(localStorage.getItem('my_notes')) || [];
        let globalFontBase64 = "";

        // Загружаем шрифт Roboto и готовим его для jsPDF
        async function prepareFont() {
            try {
                const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf';
                const response = await fetch(fontUrl);
                const blob = await response.blob();
                
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    globalFontBase64 = reader.result.split(',')[1];
                    document.getElementById('dot').className = "w-2 h-2 rounded-full bg-green-500";
                    document.getElementById('statusText').innerText = "Кириллица готова";
                };
            } catch (e) {
                document.getElementById('statusText').innerText = "Ошибка загрузки шрифта";
                console.error(e);
            }
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            notes.forEach((note, index) => {
                const div = document.createElement('div');
                div.className = "note-card bg-white p-8 rounded-[2rem] border border-slate-50 shadow-sm";
                div.innerHTML = `
                    <p class="text-slate-700 whitespace-pre-wrap mb-8 leading-relaxed text-lg font-medium">${note}</p>
                    <div class="flex justify-end gap-4 items-center">
                        <button onclick="deleteNote(${index})" class="text-xs font-bold text-slate-400 hover:text-rose-500 transition-colors uppercase tracking-widest">Удалить</button>
                        <button onclick="exportToPDF(${index})" class="bg-indigo-50 text-indigo-600 px-6 py-3 rounded-xl text-sm font-bold hover:bg-indigo-100 transition-all flex items-center gap-2">
                            PDF Экспорт
                        </button>
                    </div>`;
                container.appendChild(div);
            });
        }

        async function exportToPDF(index) {
            if (!globalFontBase64) {
                alert("Шрифт еще загружается. Попробуйте через секунду.");
                return;
            }

            const doc = new jsPDF();
            const noteText = notes[index];

            // Регистрация шрифта
            doc.addFileToVFS('Roboto-Regular.ttf', globalFontBase64);
            doc.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
            doc.setFont('Roboto'); 

            // 1. Светлый фон страницы
            doc.setFillColor(248, 250, 252);
            doc.rect(0, 0, 210, 297, 'F');
            
            // 2. Лист бумаги (белый прямоугольник)
            doc.setFillColor(255, 255, 255);
            doc.roundedRect(15, 15, 180, 260, 5, 5, 'F');

            // 3. Дата в правом верхнем углу (минималистично)
            doc.setTextColor(150, 150, 150);
            doc.setFontSize(10);
            const dateStr = new Date().toLocaleDateString('ru-RU', { 
                day: '2-digit', month: 'long', year: 'numeric' 
            });
            doc.text(dateStr, 175, 25, { align: "right" });

            // 4. Основной текст заметки
            doc.setTextColor(30, 41, 59);
            doc.setFontSize(14);
            doc.setLineHeightFactor(1.6);
            
            const lines = doc.splitTextToSize(noteText, 160);
            doc.text(lines, 25, 45);

            // 5. Тонкая линия внизу для завершенности
            doc.setDrawColor(241, 245, 249);
            doc.line(25, 260, 185, 260);

            doc.save(`Note_${index + 1}.pdf`);
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            if (!input.value.trim()) return;
            notes.unshift(input.value);
            localStorage.setItem('my_notes', JSON.stringify(notes));
            input.value = '';
            renderNotes();
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            localStorage.setItem('my_notes', JSON.stringify(notes));
            renderNotes();
        }

        // Запуск
        prepareFont();
        renderNotes();
    </script>
</body>
</html>
